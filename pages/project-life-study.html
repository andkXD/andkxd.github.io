<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artwork — Arya Satya Andhika Akbar</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"></noscript>
  <style>
    /* ── LAYOUT ─────────────────────────────── */
    body { overflow: hidden; }

    .aw-wrap {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-columns: 260px 1fr;
      z-index: 10;
    }

    /* ── LEFT SIDEBAR ───────────────────────── */
    .aw-sidebar {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 70px 0 64px 72px;
      border-right: 1px solid var(--border);
      animation: fadeInUp 0.8s ease both;
    }

    .aw-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.05em;
      transition: color 0.2s;
      margin-bottom: 32px;
    }
    .aw-back:hover { color: var(--white); }
    .aw-dir { display: inline-flex; margin-top: 18px; padding: 9px 18px; border: 1px solid rgba(255,255,255,.2); color: var(--white); text-decoration: none; font-size: .7rem; letter-spacing: .1em; transition: background .25s, border-color .25s; }
    .aw-dir:hover { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.45); }
    body.theme-light .aw-dir { color: #111; border-color: rgba(0,0,0,.3); }
    body.theme-light .aw-dir:hover { background: rgba(0,0,0,.05); border-color: rgba(0,0,0,.7); }
    .aw-pager { display: flex; gap: 28px; margin-top: 26px; }
    .aw-pager a { font-size: .68rem; color: var(--muted); text-decoration: none; letter-spacing: .08em; transition: color .2s; }
    .aw-pager a:hover { color: var(--white); }

    .aw-label {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .aw-title {
      font-size: clamp(1.6rem, 2.5vw, 2.3rem);
      font-weight: 300;
      letter-spacing: -2px;
      text-transform: uppercase;
      line-height: 0.95;
      margin-bottom: 32px;
    }

    .aw-count {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.1em;
    }

    .aw-sidebar-bottom {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .aw-filter {
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .aw-tag {
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.2s;
      padding: 2px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .aw-tag::before {
      content: '';
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .aw-tag:hover, .aw-tag.active { color: var(--white); }
    .aw-tag:hover::before, .aw-tag.active::before { background: var(--white); }

    /* ── RIGHT: INDEX LIST ──────────────────── */
    .aw-content {
      position: relative; z-index: 2;
      overflow-y: auto; overflow-x: hidden;
      padding: 70px 72px 80px 44px;
      scrollbar-width: none;
      animation: fadeInUp 0.9s ease 0.1s both;
    }
    .aw-content::-webkit-scrollbar { display: none; }

    .ix-head, .ix-row {
      display: grid;
      grid-template-columns: 56px minmax(0, 1.5fr) minmax(0, 1fr) 64px;
      column-gap: 16px; align-items: baseline;
    }
    .ix-head { padding: 0 12px 14px; font-size: .68rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
    .ix-head span:last-child, .ix-row span:last-child { text-align: right; }
    .ix-list { list-style: none; border-top: 1px solid var(--border); }
    .ix-row {
      padding: 15px 12px; font-size: .9rem; letter-spacing: .02em; color: var(--dim);
      border-bottom: 1px solid var(--border); outline: 1px solid transparent; outline-offset: -1px;
      cursor: pointer; transition: color .2s, opacity .25s, outline-color .2s, background .2s;
      text-shadow: 0 0 8px rgba(0,0,0,.85);
      -webkit-tap-highlight-color: transparent;
    }
    .ix-row .n { color: var(--muted); font-size: .72rem; }
    .ix-row .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ix-row .c { color: var(--muted); font-size: .78rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ix-list.hovering .ix-row { opacity: .32; }
    .ix-list.hovering .ix-row.on { opacity: 1; color: var(--white); font-weight: 500; outline-color: rgba(255,255,255,.75); background: rgba(0,0,0,.25); }
    .ix-list.hovering .ix-row.on .n, .ix-list.hovering .ix-row.on .c { color: var(--white); }
    .ix-row:focus-visible { outline-color: rgba(255,255,255,.75); }

    /* ── HOVER PREVIEW (besar, di belakang daftar) ── */
    .ix-prev {
      position: fixed; z-index: 1; pointer-events: none;
      left: calc(260px + (100vw - 260px) / 2); top: 50%;
      width: min(48vw, 780px); aspect-ratio: 16 / 10;
      transform: translate(-50%, -50%);
    }
    .ix-prev .pv { position: absolute; inset: 0; opacity: 0; transform: scale(.97); transition: opacity .28s ease, transform .45s cubic-bezier(.2,.7,.2,1); overflow: hidden; }
    .ix-prev .pv.on { opacity: .95; transform: none; }
    .ix-prev .pv:empty { display: none; }
    .pv canvas, .pv img, .st canvas, .st img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* ── EXPANDED VIEW ──────────────────────── */
    .ix-view {
      position: fixed; inset: 0; z-index: 500; background: #0a0a0a; color: var(--white);
      display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
      opacity: 0; pointer-events: none; transition: opacity .35s ease;
    }
    .ix-view.open { opacity: 1; pointer-events: auto; }
    .ix-vhead { padding: 26px 40px 0; }
    .ix-vhead .k { font-size: .66rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .ix-vhead h2 { font-size: clamp(1.4rem, 3vw, 2.4rem); font-weight: 300; letter-spacing: -.02em; text-transform: uppercase; line-height: 1; }
    .ix-vmain { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 36px; padding: 22px 40px; min-height: 0; align-items: center; }
    .st { position: relative; width: 100%; aspect-ratio: 16 / 10; max-height: 100%; margin: 0 auto; overflow: hidden;
          transform: scale(.88); opacity: 0; transition: transform .55s cubic-bezier(.2,.7,.2,1), opacity .4s ease; }
    .ix-view.open .st { transform: none; opacity: 1; }
    .ix-vside { font-size: .74rem; line-height: 1.7; color: var(--dim); align-self: end; padding-bottom: 6px; }
    .ix-vside dl { display: grid; grid-template-columns: 74px 1fr; gap: 6px 12px; margin-bottom: 18px; }
    .ix-vside dt { color: var(--muted); letter-spacing: .12em; text-transform: uppercase; font-size: .62rem; padding-top: 2px; }
    .ix-vside dd { color: var(--white); }
    .ix-vside p { color: var(--muted); }
    .ix-bar {
      display: flex; align-items: center; gap: 22px; margin: 0 40px 28px; padding: 11px 14px;
      border: 1px solid rgba(255,255,255,.55); font-size: .72rem; letter-spacing: .1em;
    }
    .ix-bar a, .ix-bar button { color: var(--white); background: none; border: 0; font: inherit; letter-spacing: inherit; cursor: pointer; text-decoration: none; padding: 2px 0; transition: opacity .2s; }
    .ix-bar a:hover, .ix-bar button:hover { opacity: .6; }
    .ix-bar .go { font-weight: 500; }
    .ix-bar .sp { flex: 1; }
    .ix-pos { color: var(--muted); }

    @media (hover: none), (max-width: 900px) { .ix-prev { display: none; } }
    @media (max-width: 900px) {
      .ix-head, .ix-row { grid-template-columns: 38px minmax(0, 1fr) 52px; }
      .ix-head span:nth-child(3), .ix-row .c { display: none; }
      .ix-row { padding: 16px 8px; font-size: .88rem; }
      .ix-head { padding: 0 8px 12px; }
      .ix-vhead { padding: 18px 20px 0; }
      .ix-vmain { grid-template-columns: 1fr; gap: 14px; padding: 16px 20px; align-content: start; overflow-y: auto; }
      .ix-vside { align-self: start; }
      .ix-bar { margin: 0 20px calc(18px + env(safe-area-inset-bottom, 0px)); gap: 14px; flex-wrap: wrap; }
      .ix-bar .sp { display: none; }
      .ix-bar .go { flex: 1 0 100%; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,.18); }
      .ix-bar .ix-pos { margin-right: auto; }
    }
    @media (max-height: 520px) and (min-width: 700px) { .ix-vside { display: none; } .ix-vmain { grid-template-columns: 1fr; } }

    body.theme-light .ix-view { background: #f2f0eb; color: #111; }
    body.theme-light .ix-bar { border-color: rgba(0,0,0,.55); }
    body.theme-light .ix-bar a, body.theme-light .ix-bar button, body.theme-light .ix-vside dd { color: #111; }
    body.theme-light .ix-row { text-shadow: 0 0 8px #f2f0eb; }
    body.theme-light .ix-list.hovering .ix-row.on { color: #111; outline-color: rgba(0,0,0,.7); background: rgba(255,255,255,.35); }
    body.theme-light .ix-list.hovering .ix-row.on .n, body.theme-light .ix-list.hovering .ix-row.on .c { color: #111; }

/* ============================================
   LIGHT MODE OVERRIDES — project pages
   ============================================ */
body.theme-light .detail-desc,
body.theme-light .code-line {
  color: rgba(0, 0, 0, 0.55);
}
body.theme-light .spec-value,
body.theme-light .spec-val,
body.theme-light .process-text,
body.theme-light .exp-name,
body.theme-light .exp-tile-name,
body.theme-light .tl-name {
  color: #333;
}
body.theme-light .type-specimen {
  color: rgba(0, 0, 0, 0.08);
}
body.theme-light .type-specimen span {
  color: rgba(0, 0, 0, 0.25);
}
body.theme-light .detail-visit {
  color: #111;
  border-color: rgba(0,0,0,0.3);
}
body.theme-light .detail-visit:hover {
  background: rgba(0,0,0,0.05);
  border-color: rgba(0,0,0,0.7);
}
body.theme-light .sidebar-visit {
  color: #111;
  border-color: rgba(0,0,0,0.3);
}
body.theme-light .sidebar-visit:hover {
  background: rgba(0,0,0,0.05);
  border-color: rgba(0,0,0,0.7);
}

</style>
  <!-- No-flash theme apply: set on <html> so it works before <body> exists -->
  <script>try{var t=localStorage.getItem("pw-theme")||"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body data-page="life">
  <div id="canvas-container"></div>
  <div class="screen-border"></div>

  <div class="aw-wrap">
    <!-- SIDEBAR -->
    <aside class="aw-sidebar">
      <div>
        <a href="projects.html#life-study" class="aw-back">← Projects</a>
        <p class="aw-label">Selected Works</p>
        <h1 class="aw-title">Artwork</h1>
        <p class="aw-count" id="awCount">— works</p>
        <a href="../Artwork/index.html" class="aw-dir">Artwork →</a>
      </div>
      <div class="aw-sidebar-bottom">
        <nav class="aw-pager"><a href="project-portfolio.html">← Prev</a><a href="project-motion-study.html">Next →</a></nav>
      </div>
    </aside>

    <!-- PREVIEW BESAR (muncul saat hover, di belakang daftar) -->
    <div class="ix-prev" id="ixPrev" aria-hidden="true"></div>

    <!-- DAFTAR -->
    <main class="aw-content">
      <div class="ix-head"><span>N.</span><span>Title</span><span>Category</span><span>Y.</span></div>
      <ol class="ix-list" id="ixList"></ol>
    </main>
  </div>

  <!-- TAMPILAN PENUH (klik baris) -->
  <div class="ix-view" id="ixView" role="dialog" aria-modal="true" aria-label="Artwork">
    <div class="ix-vhead"><p class="k" id="vK"></p><h2 id="vT"></h2></div>
    <div class="ix-vmain">
      <div class="st" id="vStage"></div>
      <div class="ix-vside">
        <dl id="vMeta"></dl>
        <p id="vDesc"></p>
      </div>
    </div>
    <div class="ix-bar">
      <a class="go" id="vGo" href="../Artwork/index.html">→ Open in Artwork website</a>
      <span class="sp"></span>
      <span class="ix-pos" id="vPos"></span>
      <button id="vPrev" type="button">← Prev</button>
      <button id="vNext" type="button">Next →</button>
      <button id="vClose" type="button">Close ✕</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="../assets/js/sketch.js"></script>
  <script src="../assets/js/audio.js"></script>
  <!-- Data & visual diambil dari website Artwork, jadi cukup edit di satu tempat -->
  <script src="../Artwork/assets/js/works-data.js"></script>
  <script src="../Artwork/assets/js/art.js"></script>
  <script>
    const list = document.getElementById('ixList'), prev = document.getElementById('ixPrev');
    const view = document.getElementById('ixView'), stage = document.getElementById('vStage');
    const fine = matchMedia('(hover: hover) and (pointer: fine) and (min-width: 901px)');
    const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    document.getElementById('awCount').textContent = WORKS.length + (WORKS.length === 1 ? ' work' : ' works');

    // ── daftar + preview hover (satu panel per karya, digambar saat idle) ──
    const pvs = [];
    WORKS.forEach((w, i) => {
      const li = document.createElement('li');
      li.className = 'ix-row'; li.tabIndex = 0; li.dataset.i = i;
      li.innerHTML = '<span class="n">' + esc(w.num || String(i + 1).padStart(2, '0')) + '</span>' +
                     '<span class="t">' + esc(w.title) + '</span>' +
                     '<span class="c">' + esc(w.category) + '</span>' +
                     '<span class="y">' + esc(w.year) + '</span>';
      list.appendChild(li);
      const pv = document.createElement('div'); pv.className = 'pv'; prev.appendChild(pv);
      pvs.push(pv); workVisual(pv, w, i, { lazy: true, q: .8 });
    });
    const rows = [...list.children];
    // preview hanya tampil kalau gambarnya sudah siap (tidak ada kotak kosong)
    const ready = i => !!pvs[i].querySelector('img') || (pvs[i].querySelector('canvas') && pvs[i].querySelector('canvas').style.opacity !== '0');
    function hover(i) {
      rows.forEach((r, n) => r.classList.toggle('on', n === i));
      pvs.forEach((p, n) => p.classList.toggle('on', n === i && ready(n)));
      list.classList.toggle('hovering', i >= 0);
    }
    list.addEventListener('mouseover', e => { if (!fine.matches) return; const r = e.target.closest('.ix-row'); if (r) hover(+r.dataset.i); });
    list.addEventListener('mouseleave', () => hover(-1));
    list.addEventListener('focusin', e => { if (fine.matches) { const r = e.target.closest('.ix-row'); if (r) hover(+r.dataset.i); } });
    list.addEventListener('focusout', () => hover(-1));

    // ── tampilan penuh ──
    let cur = 0;
    function show(i) {
      cur = (i + WORKS.length) % WORKS.length;
      const w = WORKS[cur];
      document.getElementById('vK').textContent = [w.num, w.category, w.year].filter(Boolean).join(' · ');
      document.getElementById('vT').textContent = w.title;
      stage.innerHTML = ''; workVisual(stage, w, cur);
      const meta = [['Role', w.role], ['Tools', w.tools], ['Status', w.status]].filter(m => m[1]);
      document.getElementById('vMeta').innerHTML = meta.map(m => '<dt>' + m[0] + '</dt><dd>' + esc(m[1]) + '</dd>').join('');
      document.getElementById('vDesc').textContent = w.desc || '';
      document.getElementById('vGo').href = w.link || ('../Artwork/works/' + w.id + '.html');
      document.getElementById('vPos').textContent = String(cur + 1).padStart(2, '0') + ' / ' + String(WORKS.length).padStart(2, '0');
    }
    function openView(i) {
      show(i); hover(-1);
      view.classList.add('open');
      document.getElementById('vClose').focus({ preventScroll: true });
    }
    function closeView() { view.classList.remove('open'); rows[cur] && rows[cur].focus({ preventScroll: true }); }
    list.addEventListener('click', e => { const r = e.target.closest('.ix-row'); if (r) openView(+r.dataset.i); });
    list.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('ix-row')) { e.preventDefault(); openView(+e.target.dataset.i); } });
    document.getElementById('vClose').addEventListener('click', closeView);
    document.getElementById('vPrev').addEventListener('click', () => show(cur - 1));
    document.getElementById('vNext').addEventListener('click', () => show(cur + 1));
    document.addEventListener('keydown', e => {
      if (!view.classList.contains('open')) return;
      if (e.key === 'Escape') closeView();
      if (e.key === 'ArrowLeft') show(cur - 1);
      if (e.key === 'ArrowRight') show(cur + 1);
    });
  </script>
  <script src="../assets/js/theme.js"></script>
</body>
</html>
