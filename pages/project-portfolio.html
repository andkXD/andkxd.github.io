<style>
.scanline {
  position: fixed; inset: 0; z-index: 2; pointer-events: none;
  background: repeating-linear-gradient(
    to bottom, transparent 0px, transparent 3px,

}
.project-detail {
  position: fixed; inset: 28px; z-index: 10;
  display: grid; grid-template-columns: 1fr 1fr;
  overflow: hidden;
}
.detail-topbar {
  position: absolute; top: 0; left: 0; right: 0;
  height: 52px; display: flex; align-items: center;
  justify-content: space-between; padding: 0 48px;
  border-bottom: 1px solid var(--border); z-index: 30;
}
.detail-back {
  display: inline-flex; align-items: center; gap: 8px;
  text-decoration: none; color: var(--muted);
  font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase;
  transition: color 0.2s;
}
.detail-back:hover { color: var(--white); }
.detail-page-id { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.15em; }

/* content sits between top + bottom bar */
.detail-content {
  position: absolute; top: 52px; bottom: 48px; left: 0; right: 0;
  display: grid; grid-template-columns: 1fr 1fr; overflow: hidden;
}

/* ── LEFT (unchanged from v8_1) ── */
.detail-left {
  display: flex; flex-direction: column; justify-content: center;
  padding: 48px 56px 48px 48px;
  border-right: 1px solid var(--border);
  animation: fadeInUp 0.8s ease both;
  overflow-y: auto;
}
.detail-category {
  font-size: 0.8rem; letter-spacing: 0.5em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 20px;
  display: flex; align-items: center; gap: 100px;
  margin-left: -0.08em; /* same optical correction as the title */
}
.detail-title {
  font-size: clamp(2.8rem, 5.5vw, 5rem); font-weight: 300;
  letter-spacing: -4px; text-transform: uppercase; line-height: 0.88;
  margin-bottom: 36px; color: var(--white);
  margin-left: -0.1em; /* optical alignment: cancels the glyph side-bearing so the "P" sits flush left */
}
.detail-quote {
  max-width: 34ch; margin: 0 0 20px;
  font-size: 0.95rem; font-weight: 300; line-height: 1.8; letter-spacing: 0.01em;
  color: var(--off-white);
}
.detail-quote::before {
  content: ''; display: block; width: 375px; height: 0.5px;
  background: var(--muted); margin-bottom: 20px;
}
.detail-quote-by {
  display: block; margin-top: 14px;
  font-size: 0.62rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted);
}
body.theme-light .detail-quote::before { background: rgba(0,0,0,0.35); }
.detail-visit {

  text-decoration: none; color: var(--white); font-size: 0.72rem;

}

.detail-cta-row { display: flex; gap: 10px; flex-wrap: wrap; }

/* ── RIGHT — GSAP CARD CAROUSEL ── */
.detail-right {
  position: relative; overflow: hidden;
  animation: fadeInUp 0.8s ease both 0.12s;
}

/* small label */
.showcase-label {
  position: absolute; top: 28px; left: 56px;
  font-size: 0.6rem; letter-spacing: 0.25em; text-transform: uppercase;
  color: var(--muted); z-index: 20; pointer-events: none;
}
.showcase-live {
  position: absolute; top: 28px; right: 48px;
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 0.58rem; color: var(--muted); letter-spacing: 0.1em; z-index: 20;
}
.showcase-live-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--muted); animation: livePulse 2s ease-in-out infinite;
}
.showcase-live.loaded .showcase-live-dot { background: #4caf50; }
.showcase-live.error  .showcase-live-dot { background: #f44336; }
@keyframes livePulse { 0%,100%{opacity:0.3} 50%{opacity:1} }

/* GSAP gallery container */
.gallery {
  position: absolute; inset: 0; overflow: hidden;
}

/* card stack */
.cards {
  position: absolute; list-style: none; margin: 0; padding: 0;
  width: 400px; height: 580px; /* 9:16 ratio */
  top: 46%; left: 50%;
  transform: translate(-50%, -50%);
}
.cards li {
  position: absolute; top: 0; left: 0;
  width: 400px; height: 580px; /* 9:16 ratio */
  border-radius: 3px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  cursor: pointer;
  background: #0c0c0c;
  transition: border-color 0.2s;
  text-decoration: none;
  display: block;
}
.cards li:hover { border-color: rgba(255,255,255,0.35); }

/* card interior */
.card-bg {
  position: absolute; inset: 0; z-index: 0;
}
.card-canvas {
  width: 100%; height: 100%; opacity: 0.85; display: block; object-fit: cover;
}
.card-body {
  position: absolute; inset: 0; z-index: 1;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 18px 14px;
  background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, transparent 55%);
}
.card-num {
  font-size: 0.6rem; color: rgba(255,255,255,0.28);
  letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 5px;
}
.card-name {
  font-size: 0.82rem; color: rgba(255,255,255,0.88);
  letter-spacing: 0.02em; line-height: 1.25;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-weight: 400;
}
.card-desc {
  font-size: 0.64rem; line-height: 1.55; color: rgba(255,255,255,0.55); margin-top: 8px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: normal;
}
body.theme-light .card-canvas { filter: invert(1); opacity: 0.6; }
body.theme-light .card-desc { color: rgba(0,0,0,0.55); }
.card-loading a { color: var(--white); text-decoration: underline; text-underline-offset: 3px; }
.card-lang {
  font-size: 0.6rem; color: rgba(255,255,255,0.35);
  letter-spacing: 0.1em; text-transform: uppercase; margin-top: 5px;
}

/* nav buttons */
.card-actions {
  position: absolute; bottom: 24px; left: 50%;
  transform: translateX(-50%);
  display: flex; gap: 14px; z-index: 20;
}
.card-btn {
  font-family: var(--font); font-size: 0.58rem; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--muted);
  background: none; border: 1px solid var(--border);
  padding: 5px 12px; cursor: crosshair;
  transition: color 0.2s, border-color 0.2s;
}
.card-btn:hover { color: var(--white); border-color: rgba(255,255,255,0.4); }

/* loading state */
.card-loading {
  position: absolute; inset: 0; display: flex;
  align-items: center; justify-content: center;

}
.card-loading-dot {
  width: 4px; height: 4px; border-radius: 50%; background: var(--muted);

.drag-proxy { visibility: hidden; position: absolute; }

/* ── BOTTOM BAR ── */
.detail-bottombar {
  position: absolute; bottom: 0; left: 0; right: 0;

/* ── LIGHT MODE ── */

body.theme-light .card-btn:hover { color: #111; border-color: rgba(0,0,0,0.5); }

<!-- GSAP suite -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script>
const GITHUB_USER = 'andkXD';
/* Repos shown on this page, in this order. Add or remove names here to change the list. */
const FEATURED = ['andkxd.github.io', 'Adaptive-Neuromorphic-Sensor', 'I2ASPO-2023', 'MSU-IREX-2026'];

/* ── generative card background painters ──
   The old ones used alpha 0.03–0.15 on a canvas that was shown at 45 % → practically invisible, so every card looked empty.
   These are clearer, fill the whole card, and are seeded by the repo name so a card looks the same on every visit. */
function seeded(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return () => { h += 0x6D2B79F5; let t = Math.imul(h ^ h >>> 15, 1 | h); t ^= t + Math.imul(t ^ t >>> 7, 61 | t); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const PAINTERS = [
  // starfield
  (cx,W,H,r)=>{ for(let i=0;i<120;i++){cx.beginPath();cx.arc(r()*W,r()*H,r()*1.8+0.5,0,Math.PI*2);cx.fillStyle=`rgba(255,255,255,${r()*0.5+0.15})`;cx.fill();} },
  // diagonal sweep lines
  (cx,W,H,r)=>{ cx.lineWidth=1; for(let i=0;i<22;i++){const x=r()*W*1.6-W*0.3; cx.beginPath();cx.moveTo(x,0);cx.lineTo(x-W*0.5,H);cx.strokeStyle=`rgba(255,255,255,${r()*0.25+0.08})`;cx.stroke();} },
  // orbit rings
  (cx,W,H,r)=>{ cx.lineWidth=1; for(let i=0;i<7;i++){cx.beginPath();cx.arc(W*0.5,H*0.4,W*(0.14+i*0.085),0,Math.PI*2);cx.strokeStyle=`rgba(255,255,255,${0.32-i*0.035})`;cx.stroke();} cx.fillStyle='rgba(255,255,255,0.7)';cx.beginPath();cx.arc(W*0.5,H*0.4,3,0,Math.PI*2);cx.fill(); },
  // grid + a few filled cells
  (cx,W,H,r)=>{ cx.lineWidth=1; cx.strokeStyle='rgba(255,255,255,0.12)'; for(let x=0;x<=W;x+=W/8){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,H);cx.stroke();} for(let y=0;y<=H;y+=H/11){cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke();} for(let i=0;i<9;i++){cx.fillStyle=`rgba(255,255,255,${r()*0.18+0.05})`;cx.fillRect(Math.floor(r()*8)*W/8,Math.floor(r()*11)*H/11,W/8,H/11);} },
  // radial rays
  (cx,W,H,r)=>{ cx.lineWidth=1; for(let a=0;a<Math.PI*2;a+=0.18){cx.beginPath();cx.moveTo(W/2,H*0.42);cx.lineTo(W/2+Math.cos(a)*W,H*0.42+Math.sin(a)*H);cx.strokeStyle=`rgba(255,255,255,${r()*0.22+0.05})`;cx.stroke();} },
  // scattered squares
  (cx,W,H,r)=>{ for(let i=0;i<34;i++){const s=r()*26+5; cx.strokeStyle=`rgba(255,255,255,${r()*0.35+0.1})`; cx.lineWidth=1; cx.strokeRect(r()*W,r()*H,s,s);} },
  // wave lines
  (cx,W,H,r)=>{ cx.lineWidth=1; for(let k=0;k<14;k++){cx.beginPath();for(let x=0;x<=W;x+=4){const y=H*(0.1+k*0.062)+Math.sin(x*0.03+k*0.7)*10; x?cx.lineTo(x,y):cx.moveTo(x,y);} cx.strokeStyle=`rgba(255,255,255,${0.1+k*0.015})`;cx.stroke();} },
];

/* ── helpers ── */
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

/* ── build one <li> card ── */
function makeCard(repo, idx) {
  const li = document.createElement('li');
  li.setAttribute('data-href', repo.html_url);
  // generative canvas bg — painters get the REAL canvas size (they used to get 130×182 on a 200×280 canvas,
  // so the pattern only filled the top-left of every card and the rest looked empty)
  const cv = document.createElement('canvas');
  cv.className = 'card-canvas';            // this class (fills the whole card) existed in the CSS but was never applied
  cv.width = 320; cv.height = 448;
  const cx = cv.getContext('2d');
  PAINTERS[idx % PAINTERS.length](cx, cv.width, cv.height, seeded(repo.name));
  const bg = document.createElement('div');
  bg.className = 'card-bg';
  bg.appendChild(cv);
  const body = document.createElement('div');
  body.className = 'card-body';
  const stars = repo.stargazers_count ? ` · ★ ${repo.stargazers_count}` : '';
  body.innerHTML = `
    <span class="card-num">${String(idx + 1).padStart(2,'0')}</span>
    <span class="card-name">${esc(repo.name)}</span>
    ${repo.description ? `<span class="card-desc">${esc(repo.description)}</span>` : ''}
    <span class="card-lang">${esc(repo.language || 'N/A')}${stars}</span>
  `;
  li.appendChild(bg);
  li.appendChild(body);
  // click → open GitHub in new tab
  li.addEventListener('click', () => window.open(repo.html_url, '_blank', 'noopener'));
  return li;
}

/* ── repo list: cached 10 min (the GitHub API allows only 60 requests/hour per IP without a token),
      8 s timeout, and the last good copy is reused if GitHub is unreachable or rate-limited ── */
const CACHE_KEY = 'gh_repos_' + GITHUB_USER, CACHE_TTL = 10 * 60 * 1000;
function readCache() {
  try { const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); return c && Array.isArray(c.repos) ? c : null; } catch (_) { return null; }
}
function writeCache(repos) {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), repos: repos.map(r => ({
      name: r.name, html_url: r.html_url, language: r.language, description: r.description, stargazers_count: r.stargazers_count })) }));
  } catch (_) {}
}
/* keep only FEATURED, in that order; anything GitHub did not return still gets a card that links to the repo */
function pickFeatured(all) {
  const byName = {}; (all || []).forEach(r => { byName[r.name.toLowerCase()] = r; });
  return FEATURED.map(n => byName[n.toLowerCase()] ||
    { name: n, html_url: `https://github.com/${GITHUB_USER}/${n}`, language: null, description: '', stargazers_count: 0 });
}
async function loadRepos() {
  const cached = readCache();
  if (cached && Date.now() - cached.t < CACHE_TTL) return pickFeatured(cached.repos);
  try {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 8000);
    const res = await fetch(`https://api.github.com/users/${GITHUB_USER}/repos?sort=updated&per_page=100`, {
      headers: { Accept: 'application/vnd.github.v3+json' }, signal: ctl.signal
    });
    clearTimeout(timer);
    if (!res.ok) throw new Error(res.status === 403 ? 'rate-limit' : String(res.status));
    const repos = await res.json();
    writeCache(repos);
    return pickFeatured(repos);
  } catch (err) {
    // GitHub unreachable / rate-limited: use the last good copy, or just plain cards linking to the repos
    return pickFeatured(cached ? cached.repos : []);
  }
}

/* ── fallback when GSAP can't load (blocked CDN / offline): one card at a time with the arrow buttons ── */
function simpleCarousel() {
  document.querySelectorAll('.cards li[data-dup]').forEach(li => li.style.display = 'none');
  const cards = Array.from(document.querySelectorAll('.cards li:not([data-dup])'));
  let i = 0;
  const show = n => {
    i = (n + cards.length) % cards.length;
    cards.forEach((li, k) => { li.style.cssText = k === i ? 'display:block;opacity:1;transform:none;scale:none;translate:none' : 'display:none'; });
  };
  document.querySelector('.card-btn.prev').onclick = () => show(i - 1);
  document.querySelector('.card-btn.next').onclick = () => show(i + 1);
  show(0);
}

/* ── load repos then boot GSAP ── */
async function init() {
  const liveEl   = document.getElementById('showcaseLive');
  const liveText = document.getElementById('showcaseLiveText');
  const loading  = document.getElementById('cardLoading');
  const gallery  = document.getElementById('galleryWrap');
  const cardList = document.getElementById('cardList');
  const ghLink   = `<a href="https://github.com/${GITHUB_USER}" target="_blank" rel="noopener noreferrer">github.com/${GITHUB_USER} ↗</a>`;
  const fail = msg => {
    loading.innerHTML = `<span style="color:rgba(255,255,255,0.45);font-size:0.62rem;letter-spacing:0.1em;text-align:center;line-height:1.9">${msg}<br>${ghLink}</span>`;
    liveEl.classList.add('error');
    liveText.textContent = 'Offline';
  };
  let repos;
  try { repos = await loadRepos(); }
  catch (err) { fail(err.message === 'rate-limit' ? 'GitHub is limiting requests right now.<br>Try again in a few minutes.' : 'Could not reach GitHub.'); return; }
  if (!repos.length) { fail('No public repositories yet.'); return; }

  repos.forEach((repo, i) => cardList.appendChild(makeCard(repo, i)));
  /* The endless GSAP carousel needs at least ~10 cards (each card's animation lasts 1 s and a new one starts every 0.1 s,
     otherwise the same card is animated twice at once and the row breaks). With few repos, repeat the set around the ring. */
  const MIN_CARDS = 12;
  for (let k = repos.length; k < MIN_CARDS; k++) {
    const li = makeCard(repos[k % repos.length], k % repos.length);
    li.dataset.dup = '1'; li.setAttribute('aria-hidden', 'true');
    cardList.appendChild(li);
  }
  loading.style.display = 'none';
  gallery.style.display = 'block';
  liveEl.classList.add('loaded');
  liveText.textContent = `github.com/${GITHUB_USER}`;
  try {
    if (window.gsap && window.Draggable) bootGSAP(); else simpleCarousel();
  } catch (err) { console.warn('carousel animation failed → simple mode', err); simpleCarousel(); }
}

/* ── GSAP infinite scroll (original CodePen logic, adapted) ── */
function bootGSAP() {
  gsap.registerPlugin(Draggable);

  const spacing     = 0.1;
  const snapTime    = gsap.utils.snap(spacing);
  const cards       = gsap.utils.toArray('.cards li');

  gsap.set(cards, { xPercent: 400, opacity: 0, scale: 0 });

  const animateFunc = el => {
    const tl = gsap.timeline();
    tl.fromTo(el,
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, zIndex: 100, duration: 0.5, yoyo: true, repeat: 1, ease: 'power1.in', immediateRender: false }
    ).fromTo(el,
      { xPercent: 400 },
      { xPercent: -400, duration: 1, ease: 'none', immediateRender: false },
      0
    );
    return tl;
  };

  const seamlessLoop = buildSeamlessLoop(cards, spacing, animateFunc);
  const playhead     = { offset: 0 };
  const wrapTime     = gsap.utils.wrap(0, seamlessLoop.duration());

  const scrub = gsap.to(playhead, {
    offset: 0,
    onUpdate() { seamlessLoop.time(wrapTime(playhead.offset)); },
    duration: 0.7,
    ease: 'power3',
    paused: true,
  });

  /* ── virtual playhead: no window scroll involved, so up AND down both work ── */
  const WHEEL_THRESHOLD = 60;    // wheel movement needed to count as one "flick" (bigger = less sensitive)
  const WHEEL_COOLDOWN  = 450;   // ms before the next card can move (bigger = slower scrolling)
  const WHEEL_PAUSE     = 140;   // ms of no wheel input that counts as "gesture finished"
  const WHEEL_HOLD      = 900;   // during one endless spin, a new card is allowed every this many ms
  let target = 0;                // where the playhead is heading, in timeline seconds

  scrub.vars.offset = 0; scrub.invalidate().restart();   // draw the initial state

  function scrollToOffset(offset) {
    target = snapTime(offset);                            // always land exactly on a card
    scrub.vars.offset = target;
    scrub.invalidate().restart();
  }
  const step = dir => scrollToOffset(target + dir * spacing);

  document.querySelector('.card-btn.prev').addEventListener('click', () => step(-1));
  document.querySelector('.card-btn.next').addEventListener('click', () => step(1));

  /* scroll wheel on the right panel: one flick = one card (down = next, up = previous).
     After a card moves, wheel input is ignored until the gesture ends (a short pause),
     so a fast spin or trackpad inertia can't skip several cards. */
  let acc = 0, lastStep = 0, lastWheel = 0, locked = false;
  document.querySelector('.detail-right').addEventListener('wheel', e => {
    e.preventDefault();
    const now = performance.now(), gap = now - lastWheel; lastWheel = now;
    if (gap > WHEEL_PAUSE) { acc = 0; locked = false; }               // a pause = a new gesture
    if (locked && now - lastStep > WHEEL_HOLD) locked = false;        // very long continuous spin: allow the next card
    if (locked) return;
    acc += e.deltaY * (e.deltaMode === 1 ? 16 : 1);                   // normalise line-based wheels
    if (Math.abs(acc) >= WHEEL_THRESHOLD && now - lastStep > WHEEL_COOLDOWN) {
      step(acc > 0 ? 1 : -1); lastStep = now; acc = 0; locked = true;
    }
  }, { passive: false });

  Draggable.create('.drag-proxy', {
    type: 'x',
    trigger: '.cards',
    onPress()    { this.startOffset = scrub.vars.offset; },
    onDrag()     { scrub.vars.offset = this.startOffset + (this.startX - this.x) * 0.001; scrub.invalidate().restart(); },
    onDragEnd()  { scrollToOffset(scrub.vars.offset); },
  });

  function buildSeamlessLoop(items, spacing, animateFunc) {
    const overlap   = Math.ceil(1 / spacing);
    const startTime = items.length * spacing + 0.5;
    const loopTime  = (items.length + overlap) * spacing + 1;
    const rawSeq    = gsap.timeline({ paused: true });
    const loop      = gsap.timeline({
      paused: true, repeat: -1,
      onRepeat() { this._time === this._dur && (this._tTime += this._dur - 0.01); },
    });
    for (let i = 0; i < items.length + overlap * 2; i++) {
      rawSeq.add(animateFunc(items[i % items.length]), i * spacing);
      if (i <= items.length) loop.add('label' + i, i * spacing);
    }
    rawSeq.time(startTime);
    loop.to(rawSeq, { time: loopTime, duration: loopTime - startTime, ease: 'none' })
        .fromTo(rawSeq, { time: overlap * spacing + 1 }, { time: startTime, duration: startTime - (overlap * spacing + 1), immediateRender: false, ease: 'none' });
    return loop;
  }
}

init();
</script>

<script src="../assets/js/audio.js"></script>
<script src="../assets/js/theme.js"></script>
</body>
